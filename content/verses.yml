# Verses shown in "Verse of the day" on the home page (King James Version)
translation: KJV
verses:
  - ref: Galatians 6:9
    text: 'And let us not be weary in well doing: for in due season we shall reap, if we faint not.'
  - ref: Proverbs 19:17
    text: He that hath pity upon the poor lendeth unto the LORD; and that which he hath given will he pay him again.
  - ref: Proverbs 22:9
    text: He that hath a bountiful eye shall be blessed; for he giveth of his bread to the poor.
  - ref: Acts 20:35
    text: It is more blessed to give than to receive.
  - ref: 2 Corinthians 9:7
    text: 'Every man according as he purposeth in his heart, so let him give; not grudgingly, or of necessity: for God loveth a cheerful giver.'
  - ref: Hebrews 13:16
    text: 'But to do good and to communicate forget not: for with such sacrifices God is well pleased.'
  - ref: Matthew 25:40
    text: Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me.
  - ref: Luke 6:38
    text: Give, and it shall be given unto you; good measure, pressed down, and shaken together, and running over, shall men give into your bosom.
  - ref: Proverbs 11:25
    text: 'The liberal soul shall be made fat: and he that watereth shall be watered also himself.'
  - ref: Psalm 82:3
    text: 'Defend the poor and fatherless: do justice to the afflicted and needy.'
  - ref: Isaiah 1:17
    text: Learn to do well; seek judgment, relieve the oppressed, judge the fatherless, plead for the widow.
  - ref: James 1:27
    text: Pure religion and undefiled before God and the Father is this, To visit the fatherless and widows in their affliction, and to keep himself unspotted from the world.
  - ref: Mark 10:14
    text: 'Suffer the little children to come unto me, and forbid them not: for of such is the kingdom of God.'
  - ref: Proverbs 22:6
    text: 'Train up a child in the way he should go: and when he is old, he will not depart from it.'
  - ref: Philippians 4:19
    text: But my God shall supply all your need according to his riches in glory by Christ Jesus.
  - ref: 1 John 3:18
    text: My little children, let us not love in word, neither in tongue; but in deed and in truth.
  - ref: Proverbs 3:27
    text: Withhold not good from them to whom it is due, when it is in the power of thine hand to do it.
  - ref: Jeremiah 29:11
    text: For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.
  - ref: Psalm 126:5
    text: They that sow in tears shall reap in joy.
  - ref: 1 Thessalonians 5:18
    text: 'In every thing give thanks: for this is the will of God in Christ Jesus concerning you.'
  - ref: Romans 12:13
    text: Distributing to the necessity of saints; given to hospitality.
  - ref: Deuteronomy 15:11
    text: Thou shalt open thine hand wide unto thy brother, to thy poor, and to thy needy, in thy land.
  - ref: Proverbs 28:27
    text: 'He that giveth unto the poor shall not lack: but he that hideth his eyes shall have many a curse.'
  - ref: Isaiah 58:10
    text: And if thou draw out thy soul to the hungry, and satisfy the afflicted soul; then shall thy light rise in obscurity, and thy darkness be as the noonday.
  - ref: Luke 3:11
    text: He that hath two coats, let him impart to him that hath none; and he that hath meat, let him do likewise.
  - ref: 1 Peter 4:10
    text: As every man hath received the gift, even so minister the same one to another, as good stewards of the manifold grace of God.
  - ref: Psalm 112:9
    text: He hath dispersed, he hath given to the poor; his righteousness endureth for ever.
  - ref: Matthew 5:16
    text: Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven.
  - ref: Psalm 127:3
    text: 'Lo, children are an heritage of the LORD: and the fruit of the womb is his reward.'
  - ref: Isaiah 40:31
    text: But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.
  - ref: Psalm 23:1
    text: The LORD is my shepherd; I shall not want.
