seo:
  title: About Us — Zakaliya Shared Blessings Ministry
  description: Learn about Zakaliya Shared Blessings Ministry, its purpose, and the work it carries forward.
hero:
  kicker: Who we are
  title: A simple mission.
  title_highlight: A lasting difference.
  text: 'Our mission is simple: to share blessings with those in need. Join us on a journey of transforming lives through practical support and shared care.'
  button_label: Explore our work
  image: /assets/hope-hero.png
  image_alt: A small hanging ornament engraved with the word hope
  caption: Hope grows when we share what we have.
mission:
  kicker: Our mission
  title: Care that becomes action.
  body: |-
    **Zakaliya Shared Blessings Ministry** was founded in 2024 to share donations and practical support with people in need.

    We support children, help create opportunities for learning, and make room for people to gather in faith and community. Every act of generosity can help transform lives.
  verse_text: “The generous will themselves be blessed, for they share their food with the poor.”
  verse_ref: Proverbs 22:9 · NIV
founders:
  title: Meet the founders
  body: |-
    Zakaliya Shared Blessings Ministry was founded in 2024 on a simple idea: share what we have with people who need it.

    That vision continues in the children we support, the classrooms and church built in Kasozi, and the tailoring and farming skills now being shared with young people.
  link_label: See the work they started
  image: /assets/founders-portrait.jpg
  image_alt: A ministry founder pictured with a young girl
  caption: A shared moment behind the ministry’s work.
recognition:
  show: true
  title: UGAMN honours our Director, Jennifer Garubanda.
  body: |-
    The UGAMN community honoured our Director, Jennifer Garubanda, for her generosity, outstanding service, and meaningful contributions to the Minnesota community. UGAMN President Elvis presented her with the Lifetime Achievement Award.

    On behalf of Zakaliya Shared Blessings Ministry, we thank UGAMN’s leadership and community for this recognition. We congratulate Jennifer and celebrate her continued service as God leads her.
  blessing: May God bless you all.
  gallery_label: Moments from Jennifer Garubanda’s Lifetime Achievement Award presentation
  photos:
    - image: /assets/jennifer-award-presentation.jpg
      alt: UGAMN President Elvis presents Jennifer Garubanda with her Lifetime Achievement Award as community members celebrate
      caption: UGAMN President Elvis presents the Lifetime Achievement Award.
    - image: /assets/jennifer-award-moment-02.jpg
      alt: Jennifer Garubanda shares a moment with community members during the award celebration
      caption: A moment of gratitude and celebration with Jennifer.
values:
  title: What guides our work
  items:
    - title: Generosity
      text: Sharing resources and opportunities with people who need support.
    - title: Dignity
      text: Offering care with respect, kindness, and attention to each person.
    - title: Hope
      text: Investing in children, learning, and places that help communities grow.
invitation:
  kicker: Stand with the ministry
  title: There is room for everyone to help.
  text: Learn more about the projects or support the ministry’s work.
  button_label: Donate
