feature:
  show: true
  title: UGAMN honours our Director, Jennifer Garubanda.
  body: |-
    The UGAMN community honoured our Director, Jennifer Garubanda, for her generosity, outstanding service, and meaningful contributions to the Minnesota community. UGAMN President Elvis presented her with the Lifetime Achievement Award.

    On behalf of Zakaliya Shared Blessings Ministry, we thank UGAMN’s leadership and community for this recognition. We congratulate Jennifer and celebrate her continued service as God leads her.

    May God bless you all.
  button_label: Read our story
  image: /assets/jennifer-award-presentation.jpg
  image_alt: UGAMN President Elvis presenting the Lifetime Achievement Award to Zakaliya Shared Blessings Ministry Director Jennifer Garubanda, surrounded by community members
  caption: UGAMN President Elvis presents Jennifer Garubanda with the Lifetime Achievement Award.
