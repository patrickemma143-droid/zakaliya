about_kicker: About the project
about_title: Room for more children to learn.
about: |-
  The Pre-School Construction project is building a safe, welcoming place for young children in Kasozi, Uganda, to learn.

  **The two-block classroom is complete, and because pupil numbers have grown, we are now adding a three-block classroom.**

  The new pre-school will give children aged 3 to 6 quality early education and room to develop, with classrooms equipped with learning materials and outdoor play areas where young learners can grow, explore, and thrive.
