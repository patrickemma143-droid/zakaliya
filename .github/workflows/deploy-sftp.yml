name: Deploy via SFTP

# ACTIVE deploy method (GoDaddy Managed WordPress only allows SFTP).
# Safety switch: a push only CHECKS the server until the repository variable
# DEPLOY_LIVE is set to true (Settings > Secrets and variables > Actions > Variables).
# To switch to FTP/FTPS later: move the "push:" trigger below into deploy-ftps.yml
# and leave only "workflow_dispatch:" here. See DEPLOY.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_only:
        description: "Check only: connect and confirm the site folder, upload nothing"
        type: boolean
        default: true

# Never run two uploads at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload site via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Builds the pages from /content (edited in the website editor) into /_site.
      # If an edit breaks the build, the job stops here and the live site is untouched.
      - name: Build the website
        run: |
          report() { echo "::error::$1: $(tail -n 12 "$2" | tr '\r\n' '  ' | cut -c1-1500)"; }
          node --version
          npm ci --no-audit --no-fund > npm.log 2>&1 || { report "npm ci failed" npm.log; exit 1; }
          npx @11ty/eleventy > build.log 2>&1 || { report "Build failed" build.log; exit 1; }
          tail -n 3 build.log
          test -f _site/pages/home.html || { echo "::error::Build produced no home page (pages/home.html)"; exit 1; }

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # A syntax error in the WordPress hand-over file would break the site, so stop before uploading.
      - name: Check PHP files for errors
        run: |
          for f in $(find _site -name '*.php'); do php -l "$f" || exit 1; done

      # Only connect to the real server: its identity (host key) is pinned in the
      # SFTP_KNOWN_HOSTS secret, so the upload can't be redirected to an impostor.
      # Reports only "set" or "EMPTY" for each secret, never the values.
      - name: Check all secrets are present
        env:
          S_HOST: ${{ secrets.SFTP_HOST || vars.SFTP_HOST }}
          S_PORT: ${{ secrets.SFTP_PORT || vars.SFTP_PORT }}
          S_USER: ${{ secrets.SFTP_USERNAME || vars.SFTP_USERNAME }}
          S_PASS: ${{ secrets.SFTP_PASSWORD }}
          S_DIR: ${{ secrets.SFTP_DIR || vars.SFTP_DIR }}
          S_KH: ${{ secrets.SFTP_KNOWN_HOSTS || vars.SFTP_KNOWN_HOSTS }}
        run: |
          missing=""
          for n in HOST PORT USERNAME PASSWORD DIR KNOWN_HOSTS; do
            case $n in HOST) v=$S_HOST;; PORT) v=$S_PORT;; USERNAME) v=$S_USER;; PASSWORD) v=$S_PASS;; DIR) v=$S_DIR;; KNOWN_HOSTS) v=$S_KH;; esac
            if [ -z "$(printf '%s' "$v" | tr -d ' \t\r\n')" ]; then missing="$missing SFTP_$n"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These repository secrets are EMPTY or missing:$missing (add them under Settings > Secrets and variables > Actions. SFTP_PASSWORD must be on the Secrets tab; the others may be Secrets or Variables)"; exit 1
          fi
          echo "All 6 SFTP secrets are set."

      - name: Trust the server's host key
        env:
          KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS || vars.SFTP_KNOWN_HOSTS }}
        run: |
          if [ -z "$KNOWN_HOSTS" ]; then echo "::error::SFTP_KNOWN_HOSTS secret is missing (see DEPLOY.md)"; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Safety check: only upload into the WordPress site folder (it must contain wp-config.php).
      # Stops a wrong SFTP_DIR from scattering files anywhere else on the server.
      - name: Confirm the target is the site folder
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST || vars.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || vars.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME || vars.SFTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.SFTP_DIR || vars.SFTP_DIR }}
        run: |
          # Explain failures without ever printing the password (GitHub also masks secrets).
          diag() {
            ssh_opts="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20"
            pw_len=${#LFTP_PASSWORD}
            pw_ws=no; [ "$LFTP_PASSWORD" != "$(printf '%s' "$LFTP_PASSWORD" | tr -d ' \t\r\n')" ] && pw_ws=yes
            user_ws=no; [ "$SFTP_USERNAME" != "$(printf '%s' "$SFTP_USERNAME" | tr -d ' \t\r\n')" ] && user_ws=yes
            echo "::error::$1 | lftp said: $(tail -n 3 /tmp/lftp.err 2>/dev/null | tr '\r\n' '  ')"
            echo "::error::Settings: username length ${#SFTP_USERNAME} (spaces/newlines: $user_ws), password length $pw_len (spaces/newlines: $pw_ws), port '${SFTP_PORT:-22}', dir '$SFTP_DIR'"
            # Which login methods does the server accept? (no password sent)
            methods=$(ssh $ssh_opts -o BatchMode=yes -o PreferredAuthentications=none -p "${SFTP_PORT:-22}" "$SFTP_USERNAME@$SFTP_HOST" exit 2>&1 \
                        | grep -v '^\*\*' | tail -n 1 | tr '\r\n' '  ')
            echo "::error::Server accepts: $methods"
            # Second opinion with the standard sftp program (password passed via environment, never printed)
            sudo apt-get install -y -qq sshpass >/dev/null 2>&1
            second=$(printf 'ls\nbye\n' | SSHPASS="$LFTP_PASSWORD" sshpass -e sftp $ssh_opts -o BatchMode=no -P "${SFTP_PORT:-22}" -b - "$SFTP_USERNAME@$SFTP_HOST" 2>&1 \
                        | grep -v '^\*\*' | tail -n 2 | tr '\r\n' '  ')
            echo "::error::Plain sftp login test: $second"
          }
          set +e
          listing=$(lftp -c "
            set net:max-retries 2; set net:timeout 30; set sftp:auto-confirm no;
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts';
            open --env-password -u \"$SFTP_USERNAME\" -p \"${SFTP_PORT:-22}\" sftp://$SFTP_HOST;
            cls -1 \"$SFTP_DIR\"; bye" 2>/tmp/lftp.err)
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then diag "Could not connect or list the folder (lftp exit $rc)"; exit 1; fi
          echo "Files in the target folder:"; echo "$listing" | sed 's|.*/||' | sort | head -40
          if ! echo "$listing" | grep -qE '(^|/)wp-config\.php$'; then
            echo "::error::wp-config.php not found in SFTP_DIR ($SFTP_DIR). Upload stopped. Check the SFTP_DIR secret."
            echo "::error::Names in that folder: $(echo "$listing" | sed 's|/*$||; s|.*/||' | sort | head -30 | tr '\n' ' ')"
            exit 1
          fi
          echo "OK: target folder contains wp-config.php"

      - name: Upload changed files
        if: ${{ (github.event_name == 'push' && vars.DEPLOY_LIVE == 'true') || (github.event_name == 'workflow_dispatch' && !inputs.check_only) }}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST || vars.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || vars.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME || vars.SFTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}   # read by lftp --env-password, never printed
          SFTP_DIR: ${{ secrets.SFTP_DIR || vars.SFTP_DIR }}
        run: |
          lftp -c "
            set net:max-retries 2;
            set net:timeout 30;
            set sftp:auto-confirm no;
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts';
            open --env-password -u \"$SFTP_USERNAME\" -p \"${SFTP_PORT:-22}\" sftp://$SFTP_HOST;
            mirror --reverse --no-perms --parallel=4 --verbose \
              _site/ \"$SFTP_DIR\";
            bye"
          # Uploads only the built site (_site). No --delete: Managed WordPress keeps its own files in the same folder.

      # The pages now live in /pages and are shown at clean addresses (/about, /projects/farming).
      # Remove the old copies at the top of the site folder (fixed names only) so they can't be opened as
      # separate pages; the old addresses keep working through wp-content/mu-plugins/zakaliya-static.php.
      - name: Remove old .html pages
        if: ${{ (github.event_name == 'push' && vars.DEPLOY_LIVE == 'true') || (github.event_name == 'workflow_dispatch' && !inputs.check_only) }}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST || vars.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || vars.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME || vars.SFTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.SFTP_DIR || vars.SFTP_DIR }}
        run: |
          # Old project pages are found by name (project-<name>.html) in the site folder only
          olds="index.html about-us.html projects.html contact.html donate.html thank-you.html 404.html editor.html"
          projects=$(lftp -c "
            set net:max-retries 2; set net:timeout 30; set sftp:auto-confirm no;
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts';
            open --env-password -u \"$SFTP_USERNAME\" -p \"${SFTP_PORT:-22}\" sftp://$SFTP_HOST;
            cls -1 \"$SFTP_DIR\"; bye" | sed 's|.*/||' | grep -E '^project-[a-z0-9-]+\.html$' || true)
          cmds=""
          dir="${SFTP_DIR%/}/"
          for f in $olds $projects; do cmds="$cmds rm -f \"$dir$f\";"; done
          lftp -c "
            set net:max-retries 2; set net:timeout 30; set sftp:auto-confirm no; set cmd:fail-exit no;
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts';
            open --env-password -u \"$SFTP_USERNAME\" -p \"${SFTP_PORT:-22}\" sftp://$SFTP_HOST;
            $cmds
            bye"
          echo "Removed old copies (if they were still there): $olds $projects"

      - name: Not live yet
        if: ${{ github.event_name == 'push' && vars.DEPLOY_LIVE != 'true' }}
        run: |
          echo "Check passed. Nothing uploaded. Set the DEPLOY_LIVE variable to true to go live."

      # Clears GoDaddy's page cache and CDN so the changes show straight away.
      # The site only allows this once per new build (see wp-content/mu-plugins/zakaliya-static.php).
      - name: Refresh GoDaddy's cache
        if: ${{ (github.event_name == 'push' && vars.DEPLOY_LIVE == 'true') || (github.event_name == 'workflow_dispatch' && !inputs.check_only) }}
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://zakaliyasbm-mn.com' }}
        run: |
          expected=$(cat _site/build-id.txt)
          for attempt in 1 2 3 4 5; do
            served=$(curl -s --max-time 20 "$SITE_URL/build-id.txt?nocache=$RANDOM$attempt" | tr -d "[:space:]")
            [ "$served" = "$expected" ] && break
            echo "Waiting for the new files to be served (attempt $attempt)..."; sleep 10
          done
          result=$(curl -s --max-time 60 -X POST -w " HTTP %{http_code}" "$SITE_URL/?zakaliya-refresh=1")
          echo "Cache refresh: $result"
          if echo "$result" | grep -q '"flushed":true'; then
            echo "::notice::GoDaddy cache refreshed: $result"
          else
            echo "::warning::Automatic cache refresh did not run ($result). Flush it by hand: Managed WordPress > Settings > Tools > Flush Cache."
          fi
