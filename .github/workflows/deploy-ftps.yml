name: Deploy via FTPS (standby)

# STANDBY deploy method for hosting with FTP/FTPS (e.g. a cPanel plan).
# It only runs when started by hand (Actions > Deploy via FTPS > Run workflow).
# To make it the active method: add the "push:" trigger back here and remove it
# from deploy-sftp.yml. See DEPLOY.md.
on:
  workflow_dispatch:

# Never run two uploads at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload site via FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}            # the host's FTP server name, e.g. ftp.zakaliyasbm-mn.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}    # e.g. /public_html/ (must end with /)
          protocol: ftps                               # encrypted FTP (explicit TLS)
          port: 21
          security: strict                             # verify the server's certificate; see DEPLOY.md if it fails
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md
            DEPLOY.md
            .env
            standalone-rebrand.html
